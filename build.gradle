plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'br.pucpr'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'br.pucpr.usuario.UsersPrinter'
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

spotless {
    java {
        googleJavaFormat()
        target 'src/**/*.java'
    }
}
